name: Trigger auto deployment for ragsearch-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ragsearch-api-AutoDeployTrigger-618d0f4c-0930-49d2-a9c4-e52352bdea71.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RAGSEARCHAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RAGSEARCHAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RAGSEARCHAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ragsearchtpgufq5i7q6ia.azurecr.io
          registryUsername: ${{ secrets.RAGSEARCHAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RAGSEARCHAPI_REGISTRY_PASSWORD }}
          containerAppName: ragsearch-api
          resourceGroup: RagSearch
          imageToBuild: ragsearchtpgufq5i7q6ia.azurecr.io/ragsearch-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


