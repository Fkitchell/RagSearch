name: Trigger auto deployment for ragsearch-api

# When this action will be executed
on:
  # Automatically trigger it when changes detected in repo
  push:
    branches: [main]

  # Allow manual trigger
  workflow_dispatch:

concurrency: { group: deploy-main, cancel-in-progress: false }

permissions:
  id-token: write
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter@v7.1.0
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: .*obj/.*, .*bin/.*
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CSHARP: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSCPD: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_CHECKOV: true
          VALIDATE_BASH_EXEC: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version:
            10.0.x

      - name: Dotnet Test
        run: dotnet test --solution RagSearch.slnx --configuration Release --verbosity normal


  deploy-foundation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [run-lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy foundational infra
        uses: azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: RagSearch
          template-file: infra/foundation.bicep

  dockerBuild:
    needs: deploy-foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: acr
        run: echo "name=$(az acr list -g RagSearch --query '[0].name' -o tsv)" >>  "$GITHUB_OUTPUT"

      - name: Build with Docker
        run: az acr build -r ${{ steps.acr.outputs.name }} -f 'RagSearch.Api/Dockerfile' -t 'ragsearch-api:${{ github.sha }}' .

  deploy-app:
    runs-on: ubuntu-latest
    needs: dockerBuild
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application
        uses: azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: create
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          scope: resourceGroup
          resource-group-name: RagSearch
          template-file: infra/app.bicep
          parameters: '{ "imageTag": "${{ github.sha }}" }'
