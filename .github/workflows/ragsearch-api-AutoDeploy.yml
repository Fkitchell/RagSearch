name: Trigger auto deployment for ragsearch-api

# When this action will be executed
on:
  # Automatically trigger it when changes detected in repo
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Docs/**"
      - "tools/**"
      - ".vscode/**"

  # Allow manual trigger
  workflow_dispatch:

concurrency: { group: deploy-main, cancel-in-progress: false }

permissions:
  id-token: write
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v7.1.0
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: (.*/obj/.*|.*/bin/.*)
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CSHARP: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSCPD: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_CHECKOV: true
          VALIDATE_BASH_EXEC: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check C# formatting
        run: dotnet format whitespace --folder --verify-no-changes
      - name: Dotnet Test
        run: dotnet test --solution RagSearch.slnx --configuration Release

  deploy-foundation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [run-lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy foundational infra
        uses: azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: RagSearch
          template-file: infra/foundation.bicep

  dockerBuild:
    needs: [run-lint, test]
    outputs:
      short_sha: ${{ steps.gh_short_sha.outputs.short_sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: acr
        run: echo "name=$(az acr list -g RagSearch --query '[0].name' -o tsv)" >>  "$GITHUB_OUTPUT"

      - id: gh_short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RagSearch.Api/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.name }}.azurecr.io/ragsearch-api::${{ steps.gh_short_sha.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-app:
    runs-on: ubuntu-latest
    needs: [dockerBuild, deploy-foundation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application
        uses: azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: create
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          scope: resourceGroup
          resource-group-name: RagSearch
          template-file: infra/app.bicep
          parameters: '{ "imageTag": "${{ needs.dockerBuild.outputs.short_sha }}" }'
